<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Rosa | Administración</title><style>:root{font-family:Inter,'Segoe UI',Arial,sans-serif;color:#402d39;background:#fcf8fa;--rose:#ac5c80;--deep:#763b59;--pale:#f9eaf1;--border:#eddde5;--muted:#8a7581}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:flex;min-height:100vh}.side{width:244px;background:#fff;border-right:1px solid var(--border);padding:30px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}.logo{font-family:Georgia,serif;font-size:30px;letter-spacing:-1px;color:var(--deep);padding:4px 14px 22px}.logo small{display:block;font:11px Inter,Arial,sans-serif;letter-spacing:3px;color:#b08097;margin-top:5px}.menu{display:grid;gap:4px}.menu button{border:0;background:transparent;color:#76616d;text-align:left;padding:12px 14px;border-radius:13px;font-size:14px}.menu button.active,.menu button:hover{background:var(--pale);color:var(--deep);font-weight:700}.main{flex:1;min-width:0;padding:34px clamp(18px,3.2vw,55px)}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:800}h1{font:normal 38px Georgia,serif;color:#56384a;margin:6px 0 8px}h2{font:normal 23px Georgia,serif;color:#56384a;margin:0 0 15px}p{color:var(--muted);line-height:1.5}.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 12px 35px #a6648210}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat .num{font-size:30px;color:#6e3a57;font-weight:750;margin:12px 0 4px}.stat label{color:var(--muted);font-size:13px}.stat em{font-style:normal;font-size:12px;color:#ac7991}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:17px;margin-top:17px}.stack{dis splay:flex;justify-content:space-between;align-items:center}.seller-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.seller-tabs button{padding:14px 5px;border:1px solid var(--border);background:white;border-radius:14px;color:var(--deep);font-weight:700}.seller-tabs button.active{background:var(--deep);color:#fff}.seller-big{padding:25px}.seller-big .btn{width:100%}.badge-green{color:#287c64;background:#eaf9f2}.pill{display:inline-block;padding:5px 9px;border-radius:100px;background:#f8ecf1;font-size:12px}.link{background:none;border:none;color:var(--rose);font-weight:700}.qr-print{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:720px){.side{position:fixed;z-index:10;transform:translateX(-100%);transition:.2s;box-shadow:0 0 20px #0001}.side.open{transform:none}.mobile-top{display:block}.main{padding:20px 15px}.fields{grid-template-columns:1fr}.grid{gap:9px}.panel{padding:17px}h1{font-size:30px}.stat .num{font-size:25px}}@media print{.app,.login,.seller-shell{display:none!important}.qr-print{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.qr-sticker{height:150px;border:1px dotted #aaa;text-align:center;padding:10px;break-inside:avoid}.qr-sticker img{width:95px;height:95px;display:block;margin:auto}.qr-sticker strong{font-size:14px}}

</style></head><body><div id="demoBanner"></div><div id="root"></div><div id="printArea" class="qr-print"></div><script>// Solo clave pública: nunca almacenar service_role ni contraseñas aquí.
window.AR_CONFIG={url:'https://ezhlltgcqektrclgzhfi.supabase.co',key:'sb_publishable_QnmVt7kK6LTX6HqY3eJcUg_wTN-O6Hp'};

const CATS=['Blusas','Pantalones','Camisas','Niño','Vestido','Zapatos','Ropa interior','Bolsas','Hogar'];
const fmt=n=>'Q'+Number(n||0).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=s=>new Date(s).toLocaleString('es-GT',{dateStyle:'short',timeStyle:'short'});
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const APP_STORAGE='atelier_rosa_cloud_session';
const API=window.AR_CONFIG.url;
const KEY=window.AR_CONFIG.key;
const roles={jansibautista:{display_name:'Administración',role:'admin',location:null},carniceria:{display_name:'Carnicería',role:'seller',location:'Carnicería'},sanantonio:{display_name:'San Antonio',role:'seller',location:'San Antonio'}};
function session(){try{return JSON.parse(sessionStorage.getItem(APP_STORAGE)||'null')}catch{return null}}
function headers(extra={}){const s=session();return {'apikey':KEY,'Authorization':'Bearer '+(s?.access_token||KEY),...extra}}
async function request(path,options={}){let res;try{res=await fetch(API+path,{...options,headers:{...headers(options.body?{'Content-Type':'application/json'}:{}),...options.headers}})}catch(e){throw Error('No hay conexión con Supabase. Revisa Internet o abre los HTML desde una página HTTPS.')}
let result=await res.json().catch(()=>({}));if(!res.ok)throw Error(result.message||result.msg||result.error_description||result.error||`Error ${res.status}`);return result}
async function auth(){let s=session();if(!s)return null;if(s.expires_at<Date.now()+45000){try{let r=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});s={...s,...r,expires_at:Date.now()+r.expires_in*1000};sessionStorage.setItem(APP_STORAGE,JSON.stringify(s))}catch(e){sessionStorage.removeItem(APP_STORAGE);return null}}return roles[s.username]?{username:s.username,...roles[s.username]}:null}
async function signin(username,password){username=String(username||'').trim().toLowerCase();if(!roles[username])throw Error('Usuario o contraseña incorrectos');
const res=await fetch(API+'/functions/v1/atelier-acceso',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({username,password})}).catch(()=>{throw Error('No se pudo conectar con Supabase')});let data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'No se pudo habilitar el usuario');
let r=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:data.email,password})});sessionStorage.setItem(APP_STORAGE,JSON.stringify({...r,username,expires_at:Date.now()+r.expires_in*1000}));location.reload()}
async function logout(){sessionStorage.removeItem(APP_STORAGE);location.reload()}
async function cloudQuery(table,sort='created_at'){await auth();return request('/rest/v1/'+table+'?select=*&order='+encodeURIComponent(sort)+'.desc&limit=1000')}
async function loadPacas(){pacas=await cloudQuery('ar_pacas');activePaca=activePaca&&pacas.some(p=>p.id===activePaca)?activePaca:(pacas[0]?.id||null)}
async function query(table,sort='created_at'){return cloudQuery(table,sort)}
async function rpc(name,params){await auth();return request('/rest/v1/rpc/'+encodeURIComponent(name),{method:'POST',body:JSON.stringify(params)})}
const client={from(table){return {insert(row){return {select(){return {async single(){try{const data=await request('/rest/v1/'+table+'?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(row)});return {data:data[0],error:null}}catch(error){return {data:null,error}}}}}}}}}};
document.getElementById('demoBanner').innerHTML='<div style="background:#f7edf2;color:#654457;border-bottom:1px solid #eadce3;padding:9px 16px;text-align:center;font-size:12px;font-weight:600">☁ Datos compartidos y guardados en Supabase · Atelier Rosa</div>';
const opt=(arr,selected)=>arr.map(v=>`<option ${String(selected)===String(v)?'selected':''} value="${h(v)}">${h(v)}</option>`).join('');
let me=null, activePaca=null, pacas=[];
const alertError=e=>window.alert('No se completó la operación: '+(e.message||e));
const loginMarkup=`<div class="login"><div class="panel"><div class="eyebrow">Bienvenida a</div><h1>Atelier Rosa</h1><p>Gestión boutique · Acceso privado</p><form class="form" id="loginForm"><label class="field">Usuario<input type="text" name="email" required autocomplete="username" placeholder="Escribe tu usuario"></label><label class="field">Contraseña<input type="password" name="password" required autocomplete="current-password"></label><button class="btn">Entrar a mi espacio</button></form><p class="muted">Acceso exclusivo para personal autorizado.</p></div></div>`;
function mountLogin(){document.getElementById('root').innerHTML=loginMarkup;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await signin(f.get('email'),f.get('password'))}catch(x){alertError(x)}}}
function requireRole(role){if(!me){mountLogin();return false}if(role&&me.role!==role){document.getElementById('root').innerHTML='<div class="login"><div class="panel"><h2>Acceso restringido</h2><p>Tu cuenta no tiene permisos para esta pantalla.</p><button class="btn" onclick="logout()">Cerrar sesión</button></div></div>';return false}return true}

let section='Resumen',items=[],moves=[],remates=[],discounts=[];
const labels=['Resumen','Imprimir','Descontar','Apartados','Traslados','Inventario','Ventas','Historial','Vendedoras','Configuración'];
const selPaca=()=>`<select id="pacaSelect">${pacas.map(p=>`<option value="${p.id}" ${p.id===activePaca?'selected':''}>${h(p.name)}</option>`).join('')}</select>`;
function layout(){document.getElementById('root').innerHTML=`<div class="app"><aside class="side" id="side"><div class="logo">Atelier Rosa<small>GESTIÓN BOUTIQUE</small></div><nav class="menu">${labels.map((x,i)=>`<button data-nav="${x}" class="${x===section?'active':''}">${['◈','▤','％','♡','⇄','▦','◉','◷','♙','⚙'][i]} &nbsp; ${x}</button>`).join('')}</nav><div style="margin:30px 12px"><button class="link" id="out">Cerrar sesión</button></div></aside><main class="main"><div class="mobile-top"><button class="btn secondary" id="hamb">☰ Menú</button></div><header class="top"><div><div class="eyebrow">Panel de administración</div><h1>${section}</h1><div class="muted">Todo tu negocio, en un solo lugar.</div></div><div class="actions"><span class="tag">Paca en uso</span><div style="min-width:155px">${selPaca()}</div></div></header><div id="content"></div></main></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;layout();render()});document.getElementById('out').onclick=logout;document.getElementById('pacaSelect').onchange=e=>{activePaca=Number(e.target.value);render()};document.getElementById('hamb').onclick=()=>document.getElementById('side').classList.toggle('open');}
async function refresh(){await loadPacas();[items,moves,remates,discounts]=await Promise.all(['ar_items','ar_movements','ar_remates','ar_discount_batches'].map(t=>query(t)));}
const pi=()=>items.filter(x=>x.paca_id===activePaca),pm=()=>moves.filter(x=>x.paca_id===activePaca),pr=()=>remates.filter(x=>x.paca_id===activePaca);
const sales=()=>pm().filter(x=>x.kind==='venta');
const sum=a=>a.reduce((s,x)=>s+Number(x||0),0);
const state=x=>x==='disponible'?'Disponible':x==='apartado'?'Apartado':x==='vendido'?'Vendido':'Baja';
const line=(obj)=>`<tr><td>${h(obj.code)}</td><td>${h(obj.category)}</td><td>${h(obj.location)}</td><td>${fmt(obj.current_price)}</td><td><span class="pill">${state(obj.status)}</span></td></tr>`;
const table=(rows,heads,fields)=>`<div class="tablewrap"><table><thead><tr>${heads.map(hd=>`<th>${hd}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${fields.map(f=>`<td>${typeof f==='function'?f(r):h(r[f])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}">Todavía no hay registros.</td></tr>`}</tbody></table></div>`;
const stat=(title,num,foot='')=>`<div class="panel stat"><label>${title}</label><div class="num">${num}</div><em>${foot}</em></div>`;
function render(){let d=document.getElementById('content');if(!activePaca&&section!=='Configuración'){d.innerHTML=`<div class="panel"><h2>Comienza registrando una paca</h2><p>Ve a Configuración y crea tu primera paca para comenzar.</p><button class="btn" onclick="section='Configuración';layout();render()">Crear mi primera paca</button></div>`;return}
if(section==='Resumen'){
let i=pi(),s=sales(),q=pr(),total=sum(s.map(x=>x.amount))+sum(q.map(x=>x.quantity*x.unit_price));
let by=[...Array(7)].map((_,n)=>{let day=new Date();day.setDate(day.getDate()-(6-n));const key=day.toLocaleDateString('en-CA');return {label:day.toLocaleDateString('es-GT',{weekday:'short'}),val:sum(s.filter(x=>new Date(x.created_at).toLocaleDateString('en-CA')===key).map(x=>x.amount))+sum(q.filter(x=>new Date(x.created_at).toLocaleDateString('en-CA')===key).map(x=>x.quantity*x.unit_price))}});
let max=Math.max(1,...by.map(x=>x.val)),week=sum(by.map(x=>x.val));
let locations=['Bodega','Carnicería','San Antonio'],colors=['#dcb3c9','#9c567b','#e4a0bd'];
let amounts=locations.map(loc=>i.filter(x=>x.location===loc&&!['vendido','baja'].includes(x.status)).length),stock=sum(amounts);
let cursor=0,segments=amounts.map((n,j)=>{let from=cursor;cursor+=(stock?n/stock*100:0);return `${colors[j]} ${from.toFixed(2)}% ${cursor.toFixed(2)}%`});
let donut=stock?`conic-gradient(${segments.join(',')})`:'conic-gradient(#f4e5ed 0 100%)';
let lastWeekDays=by.filter(x=>x.val>0).length,topDay=by.reduce((a,b)=>b.val>a.val?b:a,by[0]);
d.innerHTML=`<div class="grid">${stat('Ventas acumuladas',fmt(total),'QR + remate')}${stat('Prendas disponibles',i.filter(x=>x.status==='disponible').length,'En todas las ubicaciones')}${stat('Prendas apartadas',i.filter(x=>x.status==='apartado').length,'Precio protegido')}${stat('Ventas con QR',s.length,'Prendas vendidas')}</div>
<div class="two"><div class="panel"><div class="eyebrow">Movimiento de la semana</div><h2>Ventas últimos 7 días</h2>
<div class="sales-chart" role="img" aria-label="Ventas diarias de los últimos siete días">${by.map(x=>`<div class="sales-column" title="${x.label}: ${fmt(x.val)}"><span class="sales-value">${x.val?fmt(x.val):''}</span><div class="sales-fill" style="height:${Math.max(3,x.val/max*100)}%"></div><span class="sales-day">${h(x.label)}</span></div>`).join('')}</div>
<div class="summary-micro"><span>Vendido en 7 días<br><strong>${fmt(week)}</strong></span><span>Días con ventas: <b>${lastWeekDays} de 7</b></span><span>${week?'Mejor día: '+h(topDay.label)+' · '+fmt(topDay.val):'Sin ventas registradas todavía'}</span></div></div>
<div class="panel"><div class="eyebrow">Distribución actual</div><h2>¿Dónde está mi ropa?</h2>
<div class="location-visual"><div class="location-ring" style="background:${donut}"><div class="location-center"><b>${stock}</b>prendas</div></div><div class="location-legend">${locations.map((loc,j)=>`<div class="location-item"><span><i class="location-dot" style="background:${colors[j]}"></i>${loc}</span><b>${amounts[j]} <small style="color:#a18191;font-weight:500">(${stock?Math.round(amounts[j]/stock*100):0}%)</small></b></div>`).join('')}</div></div>
<p class="muted" style="margin:4px 0 0">Prendas disponibles y apartadas; remates sin QR por separado.</p></div></div>
<div class="summary-kpis"><div><span>Prendas vendidas con QR</span><b>${s.length}</b></div><div><span>Remates registrados (unidades)</span><b>${sum(q.map(x=>x.quantity))}</b></div><div><span>Prendas dadas de baja</span><b>${i.filter(x=>x.status==='baja').length}</b></div></div>
<div class="panel" style="margin-top:17px"><h2>Últimos movimientos</h2>${table(pm().slice(0,8),['Fecha','Tipo','Origen','Destino','Monto'],[r=>date(r.created_at),r=>h(r.kind),r=>h(r.from_location||'—'),r=>h(r.to_location||'—'),r=>r.amount===null?'—':fmt(r.amount)])}</div>`;

if(section==='Configuración')d.innerHTML=`<div class="two"><div class="panel"><h2>Nueva paca</h2><p>La paca nueva se seleccionará automáticamente. La numeración QR no se reinicia.</p><form class="form" id="pacaForm"><label class="field">Nombre o número de paca (opcional)<input name="name" placeholder="Automático: Paca 001"><small style="font-weight:400;color:#8b6678">Puedes dejarlo vacío. El sistema asignará el siguiente número.</small></label><button class="btn" type="submit">Registrar nueva paca</button><p id="pacaFeedback" role="status" aria-live="polite" style="font-size:13px;min-height:20px;margin:3px 0 0;color:#76516a"></p></form></div><div class="panel"><h2>Acceso y base de datos</h2><p>Los usuarios y permisos se administran en Supabase Auth y la tabla privada de perfiles. No se muestra el enlace de configuración a vendedoras.</p><p class="muted">Paca actual: ${h(pacas.find(x=>x.id===activePaca)?.name||'—')} · Conexión centralizada a Supabase. Los cambios quedan disponibles para ambos HTML.</p></div></div><div class="panel" style="margin-top:17px"><h2>Remates registrados en Bodega</h2><form id="remateForm" class="fields"><label class="field">Cantidad<input name="quantity" type="number" min="1" required></label><label class="field">Precio unitario Q<input name="price" type="number" min="0" step=".01" value="5" required></label><div class="field"><span>Registro</span><button class="btn">Agregar remate</button></div></form></div>`;
wire();if(['Apartados','Traslados','Ventas'].includes(section))activateInlineScanner('arScanCode');else stopInlineCamera();}
function historyTable(loc){let m=pm().filter(x=>loc==='Todos'||x.from_location===loc||x.to_location===loc).slice(0,300);return table(m,['Fecha','Movimiento','Origen','Destino','Cobrado'],[x=>date(x.created_at),'kind',x=>x.from_location||'—',x=>x.to_location||'—',x=>x.amount==null?'—':fmt(x.amount)])}
function wire(){const cat=document.getElementById('arCat');if(cat){const details={'Blusas':'Tops, camisetas, blusas de vestir y casuales.','Pantalones':'Hombre y mujer · jeans, licra, pantalonetas, shorts y faldas.','Camisas':'Camisas formales, casuales y de botones.','Niño':'Ropa infantil: bebé, niño y niña.','Vestido':'Vestidos largos, cortos y enterizos.','Zapatos':'Calzado, tenis, sandalias y botas · sin descuentos.','Ropa interior':'Hombre y mujer · brasieres, calzones y bóxeres.','Bolsas':'Carteras, mochilas y bolsos · sin descuentos.','Hogar':'Cortinas, sábanas, manteles y textiles · sin descuentos.'};const update=()=>document.getElementById('arCatHelp').textContent=details[cat.value]||'';cat.onchange=update;update();}let el=document.getElementById('printForm');if(el)el.onsubmit=async e=>{e.preventDefault();let f=new FormData(el);if(!confirm(`¿Crear ${f.get('quantity')} etiquetas de ${f.get('category')} en la paca activa?`))return;try{let rows=await rpc('ar_generate',{p_paca:activePaca,p_category:f.get('category'),p_price:Number(f.get('price')),p_quantity:Number(f.get('quantity'))});await refresh();let host=document.getElementById('printArea');host.innerHTML=rows.map(r=>`<div class="qr-sticker"><img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(r.code)}"><strong>${h(r.category)} ${fmt(r.original_price).replace('.00','')}</strong></div>`).join('');setTimeout(()=>window.print(),900)}catch(x){alertError(x)}};
el=document.getElementById('discountForm');if(el)el.onsubmit=async e=>{e.preventDefault();let stage=new FormData(el).get('stage');if(!confirm(`Aplicar la etapa ${stage} a TODAS las prendas elegibles y disponibles de San Antonio en esta paca?`))return;try{let n=await rpc('ar_discount',{p_paca:activePaca,p_stage:stage});await refresh();alert(`${n} prendas actualizadas`);render()}catch(x){alertError(x)}};
el=document.getElementById('actionForm');if(el)el.onsubmit=async e=>{e.preventDefault();let f=new FormData(el);let kind=f.get('kind');let code=f.get('code').trim();let item=items.find(x=>x.code===code);if(!item){scannerStatus('QR no registrado en el inventario.','bad');return}activePaca=item.paca_id;if(!confirm(`¿Confirmar ${kind} de ${code}?`))return;try{await rpc('ar_action',{p_code:code,p_kind:kind,p_target:f.get('target')||null,p_amount:f.get('amount')!==null&&f.get('amount')!==''?Number(f.get('amount')):null});await refresh();render();document.getElementById('actionFeedback').textContent='Movimiento guardado correctamente';scannerStatus('Movimiento confirmado en Supabase','good');document.querySelector('[name=code]')?.focus()}catch(x){alertError(x)}};
el=document.getElementById('historyFilter');if(el)el.onchange=e=>document.getElementById('historyTable').innerHTML=historyTable(e.target.value);
el=document.getElementById('remateForm');if(el)el.onsubmit=async e=>{e.preventDefault();let f=new FormData(el);try{await rpc('ar_remate_add',{p_paca:activePaca,p_location:'Bodega',p_quantity:Number(f.get('quantity')),p_unit_price:Number(f.get('price'))});await refresh();alert('Remate registrado');render()}catch(x){alertError(x)}};}

// Manejador global permanente: funciona aunque se redibuje Configuración.
let pacaGuardando=false;
document.addEventListener('submit',async function(event){
 const form=event.target;
 if(!form||form.id!=='pacaForm')return;
 event.preventDefault();event.stopImmediatePropagation();
 if(pacaGuardando)return;
 pacaGuardando=true;
 const btn=form.querySelector('button[type="submit"]');
 const message=form.querySelector('#pacaFeedback');
 const say=(txt,err=false)=>{if(message){message.textContent=txt;message.style.color=err?'#b42336':'#76516a'}};
 if(btn){btn.disabled=true;btn.textContent='Guardando paca...'}
 say('Conectando con Supabase...');
 try{
  if(!me||me.role!=='admin')throw new Error('Inicia sesión como administradora.');
  let name=String(new FormData(form).get('name')||'').trim();
  if(!name){const nums=pacas.map(p=>Number((p.name||'').match(/^Paca (\d+)$/i)?.[1]||0));name='Paca '+String(Math.max(0,...nums)+1).padStart(3,'0')}
  const data=await request('/rest/v1/ar_pacas?select=*',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name})});
  if(!Array.isArray(data)||!data[0]?.id)throw new Error('Supabase no confirmó la creación de la paca');
  const created=data[0];
  say('Paca registrada correctamente. Actualizando resumen...');
  try{await refresh()}catch(refreshError){console.warn('Paca guardada; error al refrescar:',refreshError)}
  if(!pacas.some(p=>p.id===created.id))pacas.unshift(created);
  activePaca=created.id;section='Resumen';layout();render();
 }catch(error){console.error('Error guardando paca:',error);say('No se pudo guardar: '+(error.message||String(error)),true)}
 finally{pacaGuardando=false;if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='Registrar nueva paca'}}
},true);
(async()=>{try{me=await auth();if(!requireRole('admin'))return;await refresh();layout();render()}catch(e){document.getElementById('root').innerHTML='<div class="login"><div class="panel"><h2>No se pudo cargar</h2><p>'+h(e.message)+'</p><button class="btn" onclick="location.reload()">Reintentar</button></div></div>'}})();

// Escaneo por camara: BarcodeDetector nativo, respaldo html5-qrcode.
let cameraReader=null,cameraStream=null,cameraInterval=null,cameraBusy=false;
function cameraClose(){const modal=document.getElementById('qrCameraModal');if(modal)modal.remove();if(cameraInterval)clearInterval(cameraInterval);cameraInterval=null;if(cameraReader){try{cameraReader.stop().catch(()=>{})}catch(e){}cameraReader=null;}if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}cameraBusy=false;}
async function cameraOpen(target){cameraClose();const overlay=document.createElement('div');overlay.id='qrCameraModal';overlay.innerHTML='<div class="camera-card"><div class="camera-head"><strong>Escanear etiqueta QR</strong><button type="button" id="qrClose">✕ Cerrar</button></div><p>Apunta al QR y mantén la cámara estable. La lectura es automática.</p><video id="qrNativeVideo" muted autoplay playsinline></video><div id="qrFallback" style="display:none"></div><p id="qrCamStatus" role="status">Iniciando cámara...</p></div>';document.body.appendChild(overlay);document.getElementById('qrClose').onclick=cameraClose;const status=document.getElementById('qrCamStatus');const done=value=>{if(!value||cameraBusy)return;cameraBusy=true;const input=document.getElementById(target);if(input){input.value=value.trim();input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));}cameraClose();};
try{if(!window.isSecureContext)throw Error('La cámara necesita HTTPS o localhost. Abre los HTML desde un sitio HTTPS, no directamente desde Descargas.');if(!navigator.mediaDevices?.getUserMedia)throw Error('El navegador no ofrece acceso a la cámara.');
if('BarcodeDetector' in window){let detector=new BarcodeDetector({formats:['qr_code']});cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});const video=document.getElementById('qrNativeVideo');video.srcObject=cameraStream;await video.play();status.textContent='Cámara activa. Buscando QR...';cameraInterval=setInterval(async()=>{if(cameraBusy||video.readyState<2)return;try{const codes=await detector.detect(video);if(codes.length)done(codes[0].rawValue)}catch(e){}},160);return;}
status.textContent='Preparando lector de cámara...';await new Promise((resolve,reject)=>{if(window.Html5Qrcode)return resolve();const script=document.createElement('script');script.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';script.onload=resolve;script.onerror=()=>reject(Error('No se pudo cargar el lector QR. Comprueba la conexión a Internet.'));document.head.appendChild(script)});document.getElementById('qrNativeVideo').style.display='none';document.getElementById('qrFallback').style.display='block';cameraReader=new Html5Qrcode('qrFallback');await cameraReader.start({facingMode:'environment'},{fps:15,qrbox:(w,h)=>{const d=Math.min(w,h,270);return {width:d,height:d}},aspectRatio:1.333},done,()=>{});status.textContent='Cámara activa. Buscando QR...';
}catch(e){status.textContent=e.message||String(e);if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}}}

function inlineRecognized(code){const item=items.find(i=>i.code===code);if(!item){scannerStatus('QR desconocido: '+code,'bad');return;}if(['vendido','baja'].includes(item.status)){scannerStatus('NO DISPONIBLE · '+code+' ya está '+item.status+'.','bad');return;}const p=pacas.find(p=>p.id===item.paca_id);scannerStatus('✓ '+code+' · '+item.location+' · '+fmt(item.current_price)+' · '+(p?.name||'Paca '+item.paca_id)+' · '+item.status,'good');}
// Lector integrado, sin modal. Mantiene la cámara abierta durante la operación.
let inReader=null,inStream=null,inTimer=null,inTarget=null,inBusy=false,inLast='',inLastAt=0,inGeneration=0;
function stopInlineCamera(){inGeneration++;if(inTimer)clearInterval(inTimer);inTimer=null;if(inReader){try{Promise.resolve(inReader.stop()).catch(()=>{});}catch(e){}inReader=null;}if(inStream){inStream.getTracks().forEach(t=>t.stop());inStream=null;}inBusy=false;}
function scannerStatus(message,type=''){const el=document.getElementById('inlineStatus');if(el){el.textContent=message;el.className='qr-feedback '+type;}}
function activateInlineScanner(inputId){const input=document.getElementById(inputId);if(!input)return;inTarget=inputId;input.removeAttribute('required');const previous=document.getElementById('inlineScanner');if(previous)previous.remove();const panel=document.createElement('div');panel.id='inlineScanner';panel.className='inline-scanner';panel.innerHTML='<div style="font-weight:750;color:#743954">📷 Escáner de prendas</div><div class="scan-hint">Apunta al QR. Verifica la prenda y confirma la operación. La cámara seguirá disponible.</div><video id="inlineVideo" muted autoplay playsinline></video><div id="inlineFallback" class="qr-canvas reader-hidden"></div><div class="qr-feedback" id="inlineStatus" role="status">Solicitando acceso a la cámara...</div><button class="small-btn" id="inlineRetry" type="button">↻ Activar o reintentar cámara</button><details><summary style="color:#8a6578;font-size:12px">Ingreso manual de respaldo</summary><p class="scan-hint">Solo si la cámara no está disponible, escribe el código en el campo inferior.</p></details>';
input.closest('label')?.before(panel);document.getElementById('inlineRetry').onclick=()=>startInlineCamera();document.getElementById('inlineVideo').addEventListener('loadedmetadata',()=>{});startInlineCamera();}
async function startInlineCamera(){stopInlineCamera();const generation=inGeneration;const video=document.getElementById('inlineVideo');if(!video)return;document.getElementById('inlineFallback')?.classList.add('reader-hidden');video.classList.remove('reader-hidden');scannerStatus('Iniciando cámara...');try{
if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Para abrir la cámara, publica ambos HTML en HTTPS o utiliza localhost. Desde Descargas (file://) puede estar bloqueada.');
let native=false;try{if('BarcodeDetector' in window){const detector=new BarcodeDetector({formats:['qr_code']});inStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});if(generation!==inGeneration){inStream.getTracks().forEach(t=>t.stop());return;}video.srcObject=inStream;await video.play();native=true;scannerStatus('Cámara activa · coloca un QR dentro del recuadro');inTimer=setInterval(async()=>{if(inBusy||video.readyState<2||generation!==inGeneration)return;inBusy=true;try{const results=await detector.detect(video);if(results.length)onInlineRead(results[0].rawValue);}catch(e){}finally{inBusy=false;}},220);}}catch(e){if(inStream){inStream.getTracks().forEach(t=>t.stop());inStream=null;}if(e?.name==='NotAllowedError')throw e;}
if(native)return;
await new Promise((resolve,reject)=>{if(window.Html5Qrcode)return resolve();const s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=resolve;s.onerror=()=>reject(Error('No se pudo cargar el lector QR'));document.head.append(s)});
if(generation!==inGeneration)return;video.classList.add('reader-hidden');document.getElementById('inlineFallback').classList.remove('reader-hidden');inReader=new Html5Qrcode('inlineFallback');await inReader.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>{const x=Math.min(260,w,h);return {width:x,height:x}}},v=>onInlineRead(v),()=>{});scannerStatus('Cámara activa · lista para escanear');
}catch(e){scannerStatus(e?.name==='NotAllowedError'?'Permiso de cámara denegado. Habilita el permiso en el navegador.':(e.message||String(e)),'bad');}}
function onInlineRead(value){const code=String(value||'').trim();if(!code)return;const now=Date.now();if(inLast===code&&now-inLastAt<5500){scannerStatus('QR repetido: '+code+' · Ya se leyó. No se registró otro movimiento.','duplicate');return;}inLast=code;inLastAt=now;const input=document.getElementById(inTarget);if(!input)return;input.value=code;input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));scannerStatus('QR reconocido: '+code+' · Comprueba los datos y confirma.','good');try{navigator.vibrate?.(90)}catch(e){};if(typeof inlineRecognized==='function')inlineRecognized(code);}
</script></body></html>
